# Inventory for the QuickBite food-delivery deployment
# Replace the IPs / user / key path with your own VMs (VirtualBox, WSL2, AWS EC2, etc.)

[webservers]
web1 ansible_host=192.168.56.121
web2 ansible_host=192.168.56.122

[dbservers]
db1  ansible_host=192.168.56.130

# Group of groups: everything we manage
[quickbite:children]
webservers
dbservers

[quickbite:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/id_rsa
