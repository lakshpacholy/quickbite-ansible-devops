# Single-machine inventory: the web tier AND the database tier both run on
# your own Ubuntu / WSL2 machine (no SSH needed).  Usage:
#   ansible-playbook -i inventory/local.ini site.yml --ask-become-pass

[webservers]
localhost ansible_connection=local

[dbservers]
localhost ansible_connection=local

[quickbite:children]
webservers
dbservers
