---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install baseline packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Create application system user
  ansible.builtin.user:
    name: "{{ app_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ app_dir }}"
    create_home: false

- name: Set the hostname to match the inventory name
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"
  when: ansible_connection | default('ssh') != 'local'

- name: Allow required ports through UFW
  community.general.ufw:
    rule: allow
    port: "{{ item | string }}"
    proto: tcp
  loop: "{{ open_firewall_ports | default([22]) }}"
  when: ansible_connection | default('ssh') != 'local'
  notify: Enable firewall

- name: Print OS information (shown in demo)
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }} runs {{ ansible_distribution }} {{ ansible_distribution_version }}"
